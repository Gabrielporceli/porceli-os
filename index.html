<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: o app ocupa a tela inteira do iPhone (atrás do
         notch e da barra inferior); quem devolve o espaço é o CSS, com
         env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Porceli Company</title>

    <!-- App na tela de início (PWA): no iPhone, Safari > Compartilhar >
         "Adicionar à Tela de Início" abre em tela cheia, sem barra do Safari. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Porceli OS" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Fundo escuro antes do CSS carregar: sem isto o app abre com um
         clarão branco na tela de início. -->
    <style>html, body { background-color: #000; }</style>
    <meta name="description" content="Sistema de CRM para gestão de leads, clientes e contratos" />
    <meta name="author" content="Porceli Company" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="alternate icon" href="/favicon.png" type="image/png">

    <meta property="og:title" content="Porceli Company" />
    <meta property="og:description" content="Sistema de CRM para gestão de leads, clientes e contratos" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@porcelicompany" />
    <meta name="twitter:image" content="/logo.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
